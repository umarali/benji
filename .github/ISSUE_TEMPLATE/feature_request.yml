name: Feature request
description: Suggest something Benji could do, or do differently.
title: "[idea] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Benji is a small project with one maintainer, so ideas are weighed against safety first: a
        change that lets Benji do more without asking needs a clear reason. See docs/ROADMAP.md for
        what is already intended. Please do not paste keys or personal text.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The need, not the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like Benji to do?
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: What should it ask about, and what should it never do?
      description: If the idea reads files, changes things, sends data anywhere or acts for you, how should the approval gate treat it?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I have not pasted API keys, tokens, passwords or personal text.
          required: true
