name: Bug report
description: Something does not work, or Benji did something it should not have.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Do not paste API keys, tokens, passwords, or personal text** (messages
        you sent, file contents, page text, screenshots of private windows). The diagnostics report below
        is metadata only and is meant to be pasted; check it anyway before you do.

        A **security problem** (Benji did something the approval gate should have asked about, or leaked
        something) is not a public issue: see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you asked for (in your own words, without private content), what you expected, and what Benji did instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: false
  - type: textarea
    id: diagnose
    attributes:
      label: "Output of `benji --diagnose`"
      description: |
        Run `python3 -m benji --diagnose --hours 24` in the repository folder (or use Settings > General >
        Diagnostics > Copy in the app) and paste the result. It lists what ran, how the gate classed it,
        approvals, job states and errors, and holds no message or file text. Read it before pasting.
      render: text
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Notch app / panel
        - Voice (talk key, transcription, spoken answers)
        - Approval gate / cards
        - Background jobs
        - Browser reach (Chrome extension)
        - Model provider (name it below)
        - Screen context / pointing
        - Build / install
        - Engine / command line
        - Other
    validations:
      required: true
  - type: input
    id: provider
    attributes:
      label: Model provider and model
      description: "Output of `python3 -m benji --print-provider` (it prints no key). Say if it is a local model."
      placeholder: "claude, claude-haiku-5-5"
  - type: input
    id: versions
    attributes:
      label: macOS, Mac model, Benji version
      placeholder: "macOS 15.1, MacBook Pro M3, Benji 0.1.0 (git sha abc1234)"
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I have not pasted API keys, tokens, passwords or personal text.
          required: true
