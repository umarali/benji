<!-- @dsCard group="Panel" height=230 subtitle="No · Adjust · Yes" -->
<style>
  body { margin: 0; background: var(--window-bg); color: var(--label); font-family: var(--font-sans); }
  .stage { padding: 20px; display: flex; flex-direction: column; gap: 16px; align-items: flex-start; }
  .cap { font-family: var(--font-sans); font-size: 11px; line-height: 14px; color: var(--label-secondary); }
  .notch { background: var(--notch-black); color: var(--notch-label); }
  .sym { font-family: var(--font-sans); font-weight: 600; }
</style>
<style>
  .wrap { width: 440px; background: var(--notch-black); border-radius: var(--radius-card); padding: var(--space-3); }
  .card { background: var(--notch-raised); border-radius: var(--radius-card); border-top: 2px solid var(--state-approval); padding: var(--space-4); color: var(--notch-label); display: flex; flex-direction: column; gap: var(--space-2); }
  .head { display: flex; gap: var(--space-2); align-items: center; font-size: 13px; line-height: 16px; font-weight: 700; }
  .hand { color: var(--state-approval); }
  code { font-family: var(--font-mono); font-size: 12px; color: var(--notch-label-secondary); }
  .btns { display: flex; gap: var(--space-2); justify-content: flex-end; margin-top: var(--space-1); }
  .b { border-radius: var(--radius-pill); padding: 5px 14px; font-size: 13px; font-weight: 600; background: rgba(255,255,255,0.10); color: var(--notch-label); }
  .yes { background: var(--accent); color: #ffffff; }
</style>
<div class="stage"><div class="wrap"><div class="card">
  <div class="head"><span class="hand">✋</span>Move 12 files to Archive</div>
  <code>~/Desktop/Screenshot 2026-10-*.png → ~/Documents/Archive/</code>
  <div class="btns"><span class="b">No</span><span class="b">Adjust</span><span class="b yes">Yes</span></div>
</div></div></div>
