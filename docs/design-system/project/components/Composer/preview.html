<!-- @dsCard group="Panel" height=170 subtitle="Idle, typing, screen context on" -->
<style>
  body { margin: 0; background: var(--window-bg); color: var(--label); font-family: var(--font-sans); }
  .stage { padding: 20px; display: flex; flex-direction: column; gap: 16px; align-items: flex-start; }
  .cap { font-family: var(--font-sans); font-size: 11px; line-height: 14px; color: var(--label-secondary); }
  .notch { background: var(--notch-black); color: var(--notch-label); }
  .sym { font-family: var(--font-sans); font-weight: 600; }
</style>
<style>
  .bar { width: 440px; background: var(--notch-black); border-radius: var(--radius-card); padding: var(--space-3); display: flex; align-items: flex-end; gap: var(--space-2); }
  .tog { font-weight: 700; width: 22px; text-align: center; padding-bottom: 6px; }
  .field { flex: 1; background: var(--notch-raised); border: 1px solid var(--notch-hairline); border-radius: var(--radius-field); padding: 7px 10px; font-size: 13px; line-height: 16px; color: var(--notch-label); }
  .ph { color: var(--notch-label-secondary); }
  .send { width: 22px; height: 22px; border-radius: 11px; background: var(--benji-mint); color: var(--notch-black); font-weight: 800; display: flex; align-items: center; justify-content: center; font-size: 13px; margin-bottom: 3px; }
  .off { opacity: 0.35; }
</style>
<div class="stage">
  <div class="bar"><span class="tog" style="color:var(--notch-label-secondary)">⌖</span><span class="field ph">Ask Benji…</span><span class="send off">↑</span></div>
  <div class="bar"><span class="tog" style="color:var(--state-looking)">⌖</span><span class="field">Where's the export option in this app?</span><span class="send">↑</span></div>
</div>
