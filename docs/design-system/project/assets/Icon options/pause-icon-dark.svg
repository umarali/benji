<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Chilly app icon, two lines (dark)</title>
  <defs>
    <linearGradient id="sheen" x1="0" y1="100" x2="0" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- layer 1: body, notch black -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="#000000"/>
  <!-- layer 2: the one subtle highlight -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sheen)"/>
  <!-- layer 3: the "ll" in luminous chilly-mint -->
  <g fill="none" stroke="#66D4CF" stroke-width="88" stroke-linecap="round">
    <path d="M414 256V668"/>
    <path d="M610 356V768"/>
  </g>
</svg>
